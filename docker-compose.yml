services:
  postgres:
    image: postgres:16-alpine
    container_name: nestjs-rbac-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nestjs_rbac
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nestjs_rbac']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: nestjs-rbac-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nestjs_rbac?schema=public
      JWT_ACCESS_SECRET: change-me-access-secret-in-production
      JWT_REFRESH_SECRET: change-me-refresh-secret-in-production
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/main.js"

volumes:
  postgres_data:
